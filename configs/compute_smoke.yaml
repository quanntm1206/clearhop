# Short GPU training run to verify optimizer/data/validation behavior.
sr: 16000
n_fft: 320
hop: 160
freq_bins: 161
segment_len: 2.0
clean_root: data/clean_16k
noise_root: data/noise_16k
batch_size: 2
num_workers: 0
epochs: 1
lr: 2.0e-4
weight_decay: 1.0e-2
optimizer: AdamW
scheduler: cosine
mixed_precision: false
enc_channels: 32
num_encoder_blocks: 2
gru_hidden: 64
gru_layers: 1
k_tap: 3
activation: silu
loss: complex_mse_plus_si_sdr
alpha_loss: 1.0
beta_si_sdr: 0.1
snr_range: [-10, 20]
p_rir: 0.0
p_vary: 0.0
cache_mixtures: false
seed: 42
n_val: 8
steps_per_epoch: 10
save_every_n_steps: 10
