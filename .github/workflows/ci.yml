name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install desktop and development dependencies
        run: python -m pip install -e ".[desktop,dev,export]"
      - name: Test suite
        run: python -m pytest -q
      - name: Public production evidence verifier
        run: python scripts/verify_public_production.py
      - name: Rebuild and verify pinned RNNoise recipe
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/verify_rnnoise_build.py --rebuild
      - name: Public research evidence verifier
        run: python scripts/verify_public_research.py
      - name: Publish readiness verifier
        run: python scripts/verify.py --publish-readiness
      - name: Desktop headless smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_desktop_app.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install desktop and development dependencies
        shell: pwsh
        run: python -m pip install -e ".[desktop,dev,export]"
      - name: Test suite
        shell: pwsh
        run: python -m pytest -q
      - name: Public production, research, and publish gates
        shell: pwsh
        run: |
          python scripts/verify_public_production.py
          if ($LASTEXITCODE -ne 0) { throw "Public production evidence gate failed." }
          python scripts/verify_public_research.py
          if ($LASTEXITCODE -ne 0) { throw "Public research evidence gate failed." }
          python scripts/verify.py --publish-readiness
          if ($LASTEXITCODE -ne 0) { throw "Publish readiness gate failed." }
      - name: Actual offscreen desktop E2E
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_desktop_e2e.py
      - name: Clean offline installer integration
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $installRoot = [IO.Path]::GetFullPath((Join-Path $runnerTemp "clearhop-installer-integration"))
          $smokeRoot = Join-Path $installRoot "smoke-cwd"
          $prefix = $runnerTemp.TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
          if (-not $installRoot.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Installer test directory escaped RUNNER_TEMP."
          }
          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }
          try {
            .\scripts\install-desktop.ps1 -Offline -NoShortcuts -InstallDir $installRoot
            if ($LASTEXITCODE -ne 0) { throw "Offline installer failed." }

            $manifest = Get-Content configs\desktop_assets.json -Raw | ConvertFrom-Json
            foreach ($asset in $manifest.assets) {
              $installedAsset = Join-Path (Join-Path $installRoot "assets") $asset.name
              if (-not (Test-Path -LiteralPath $installedAsset)) {
                throw "Installer omitted asset: $($asset.name)"
              }
              $actualAssetSha = (Get-FileHash -LiteralPath $installedAsset -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualAssetSha -ne ([string]$asset.sha256).ToLowerInvariant()) {
                throw "Installed asset hash mismatch: $($asset.name)"
              }
            }

            $installedPython = Join-Path $installRoot "venv\Scripts\python.exe"
            $installedEntrypoint = Join-Path $installRoot "venv\Scripts\noise-reduce-desktop.exe"
            New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
            $inputWav = Join-Path $smokeRoot "input.wav"
            $outputWav = Join-Path $smokeRoot "output.wav"
            $receiptPath = Join-Path $smokeRoot "receipt.json"
            & $installedPython -c "import numpy as np, soundfile as sf; sr=16000; x=(0.1*np.sin(2*np.pi*440*np.arange(sr)/sr)).astype('float32'); sf.write(r'$inputWav', x, sr)"
            if ($LASTEXITCODE -ne 0) { throw "Installer smoke fixture generation failed." }

            $env:NOISE_REDUCE_CHECKPOINT = $null
            Push-Location $smokeRoot
            try {
              & $installedEntrypoint --smoke-input $inputWav --smoke-output $outputWav --smoke-receipt $receiptPath
              if ($LASTEXITCODE -ne 0) { throw "Installed CLI denoise failed." }
            } finally {
              Pop-Location
            }

            $receipt = Get-Content $receiptPath -Raw | ConvertFrom-Json
            $checkpointAsset = $manifest.assets | Where-Object name -eq "checkpoint.pth"
            $outputSha = (Get-FileHash -LiteralPath $outputWav -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($receipt.status -ne "pass" -or $receipt.checkpoint_sha256 -ne ([string]$checkpointAsset.sha256).ToLowerInvariant() -or $receipt.output_sha256 -ne $outputSha) {
              throw "Installed CLI receipt is not output/model hash-bound."
            }
          } finally {
            if (Test-Path -LiteralPath $installRoot) {
              Remove-Item -LiteralPath $installRoot -Recurse -Force
            }
          }
