name: ClearHop desktop release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build-publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and build dependencies
        shell: pwsh
        run: python -m pip install -e ".[desktop,dev,export]" pyinstaller
      - name: Full test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Production verifier
        shell: pwsh
        run: python scripts/verify.py --production-readiness
      - name: Research verifier
        shell: pwsh
        run: python scripts/verify.py --research-readiness
      - name: Publish-readiness verifier
        shell: pwsh
        run: python scripts/verify.py --publish-readiness
      - name: Clean wheel install smoke
        shell: pwsh
        run: |
          python -m build --wheel
          $target = Join-Path $env:RUNNER_TEMP "clearhop-wheel"
          python -m venv $target
          & (Join-Path $target "Scripts/python.exe") -m pip install (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          if ($LASTEXITCODE -ne 0) { throw "Wheel install failed" }
      - name: Build PyInstaller onedir
        shell: pwsh
        run: .\scripts\build-desktop.ps1 -Clean -OutputDir dist\desktop
      - name: Packaged launch outside repository
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\scripts\smoke-packaged-desktop.ps1 -Executable dist\desktop\ClearHop\ClearHop.exe -WorkingDirectory $env:RUNNER_TEMP
      - name: Release inventory and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist\desktop\ClearHop -DestinationPath ClearHop-windows-x64.zip -Force
          (Get-FileHash ClearHop-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Out-File ClearHop-windows-x64.zip.sha256 -Encoding ascii
          if ((Get-Item ClearHop-windows-x64.zip).Length -gt 500MB) { throw "Release archive exceeds 500 MB" }
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ClearHop-windows-x64.zip
            ClearHop-windows-x64.zip.sha256
            artifacts/cpu_bundle/checkpoint.pth
            artifacts/cpu_bundle/model.onnx
